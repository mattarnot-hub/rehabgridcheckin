name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site (app files only)
        run: mkdir _site && cp -r index.html css js assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # Give the artifact API a moment to index before deploy-pages looks it
      # up - without this, deploy-pages can intermittently fail with "Found
      # 0 artifact(s)" right after a fast upload.
      - run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v4
