<svg viewBox="0 0 400 230" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Real tempo, not a quick demo loop: lift, hold 5 sec, lower slowly - 8 sec per rep. */
    @keyframes curlHoldLower {
      0%       { transform: rotate(0deg); }
      14%      { transform: rotate(-34deg); }
      74%      { transform: rotate(-34deg); }
      100%     { transform: rotate(0deg); }
    }
    .hand-wrap { transform-origin: 225px 163px; animation: curlHoldLower 8s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .hand-wrap { animation: none; transform: rotate(-34deg); }
    }
  </style>
  <line x1="30" y1="185" x2="370" y2="185" stroke="#1B2A4E" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#1B2A4E" stroke-width="2">
    <line x1="55" y1="188" x2="47" y2="195"/><line x1="80" y1="188" x2="72" y2="195"/>
    <line x1="105" y1="188" x2="97" y2="195"/><line x1="130" y1="188" x2="122" y2="195"/>
  </g>
  <rect x="75" y="150" width="150" height="26" rx="13" fill="#5B6B8F"/>
  <circle cx="88" cy="163" r="11" fill="#1B2A4E"/>
  <g class="hand-wrap">
    <!-- open palm, facing up, weight resting in it -->
    <path d="M213 159 Q 245 141 277 159 L 270 170 Q 245 156 220 170 Z" fill="#1B2A4E"/>
    <g transform="translate(307 148)">
      <circle r="13" fill="none" stroke="#C89B3C" stroke-width="5"/>
      <circle cx="-26" cy="0" r="9" fill="#C89B3C"/>
      <circle cx="26" cy="0" r="9" fill="#C89B3C"/>
      <rect x="-26" y="-3" width="52" height="6" fill="#C89B3C"/>
    </g>
  </g>
  <path d="M265 158 C 282 133, 285 116, 284 106" fill="none" stroke="#C89B3C" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow8)"/>
  <defs>
    <marker id="arrow8" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#C89B3C"/>
    </marker>
  </defs>
  <text x="150" y="220" text-anchor="middle" font-size="15" font-weight="700" fill="#1B2A4E" font-family="system-ui,sans-serif">Forearm flat, palm up</text>
  <text x="300" y="42" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1B2A4E" font-family="system-ui,sans-serif">Lift, hold 5 sec,</text>
  <text x="300" y="60" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1B2A4E" font-family="system-ui,sans-serif">lower slowly</text>
</svg>
