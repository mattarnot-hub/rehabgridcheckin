<svg viewBox="0 0 400 230" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* A hold, not a rep: small amplitude, slow, long dwell at the stretch -
       gently pull in and ease off, not a repeated yank. */
    @keyframes gentleStretch {
      0%, 15%  { transform: rotate(54deg); }
      40%, 75% { transform: rotate(62deg); }
      95%,100% { transform: rotate(54deg); }
    }
    .stretch-arm { transform-origin: 185px 125px; animation: gentleStretch 4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .stretch-arm { animation: none; transform: rotate(62deg); }
    }
  </style>
  <circle cx="55" cy="95" r="22" fill="#5B6B8F"/>
  <rect x="60" y="112" width="120" height="26" rx="13" fill="#5B6B8F"/>
  <g class="stretch-arm">
    <rect x="173" y="113" width="78" height="22" rx="11" fill="#1B2A4E"/>
    <g stroke="#1B2A4E" stroke-width="7" stroke-linecap="round">
      <line x1="245" y1="98" x2="258" y2="112"/>
      <line x1="258" y1="98" x2="258" y2="116"/>
      <line x1="271" y1="100" x2="263" y2="118"/>
    </g>
    <ellipse cx="248" cy="148" rx="18" ry="13" fill="#5B6B8F"/>
  </g>
  <path d="M255 120 C 262 150, 258 172, 252 182" fill="none" stroke="#C89B3C" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow3)"/>
  <defs>
    <marker id="arrow3" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#C89B3C"/>
    </marker>
  </defs>
  <g stroke="#C89B3C" stroke-width="2.5" stroke-linecap="round">
    <line x1="150" y1="95" x2="140" y2="85"/>
    <line x1="160" y1="90" x2="155" y2="78"/>
  </g>
  <text x="150" y="205" text-anchor="middle" font-size="15" font-weight="700" fill="#1B2A4E" font-family="system-ui,sans-serif">Arm out, palm facing you</text>
  <text x="248" y="48" text-anchor="middle" font-size="15" font-weight="700" fill="#1B2A4E" font-family="system-ui,sans-serif">Pull hand down &amp; back</text>
</svg>
