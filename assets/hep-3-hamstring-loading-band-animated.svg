<svg viewBox="0 0 400 230" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes turnAnkle {
      0%, 10%  { transform: rotate(0deg); }
      30%, 40% { transform: rotate(-18deg); }
      60%, 70% { transform: rotate(18deg); }
      92%,100% { transform: rotate(0deg); }
    }
    .foot-rot { transform-origin: 270px 180px; animation: turnAnkle 3s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .foot-rot { animation: none; }
    }
  </style>

  <line x1="20" y1="195" x2="380" y2="195" stroke="#1B2A4E" stroke-width="3" stroke-linecap="round"/>

  <!-- lying on back -->
  <circle cx="50" cy="182" r="14" fill="#1B2A4E"/>
  <path d="M64 186 L150 186" stroke="#1B2A4E" stroke-width="20" stroke-linecap="round"/>
  <path d="M150 186 L205 110" stroke="#1B2A4E" stroke-width="20" stroke-linecap="round"/>
  <path d="M205 110 L270 180" stroke="#5B6B8F" stroke-width="18" stroke-linecap="round"/>

  <!-- band anchor -->
  <rect x="336" y="150" width="9" height="45" rx="3" fill="#5B6B8F"/>
  <path d="M270 180 C 300 170, 320 168, 338 168" fill="none" stroke="#C89B3C" stroke-width="3" stroke-dasharray="5 4"/>

  <g class="foot-rot">
    <path d="M270 180 L300 176 L296 194 L274 196 Z" fill="#1B2A4E"/>
  </g>

  <text x="110" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#1B2A4E" font-family="system-ui,sans-serif">Drive heel down</text>
  <text x="283" y="150" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1B2A4E" font-family="system-ui,sans-serif">Turn ankle in / out</text>
  <text x="340" y="212" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5B6B8F" font-family="system-ui,sans-serif">Band anchored</text>
</svg>
