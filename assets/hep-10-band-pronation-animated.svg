<svg viewBox="0 0 400 230" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes pronateRotate {
      0%, 10%  { transform: rotate(0deg); }
      45%, 55% { transform: rotate(-70deg); }
      92%,100% { transform: rotate(0deg); }
    }
    .dial-wrap { transform-origin: 248px 163px; animation: pronateRotate 2.8s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .dial-wrap { animation: none; transform: rotate(-70deg); }
    }
  </style>
  <line x1="30" y1="185" x2="370" y2="185" stroke="#1B2A4E" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#1B2A4E" stroke-width="2">
    <line x1="55" y1="188" x2="47" y2="195"/><line x1="80" y1="188" x2="72" y2="195"/>
    <line x1="105" y1="188" x2="97" y2="195"/><line x1="130" y1="188" x2="122" y2="195"/>
  </g>
  <rect x="75" y="150" width="150" height="26" rx="13" fill="#5B6B8F"/>
  <circle cx="88" cy="163" r="11" fill="#1B2A4E"/>

  <!-- band anchor, fixed to the table -->
  <rect x="330" y="178" width="10" height="14" fill="#5B6B8F"/>
  <path d="M248 163 C 290 150, 320 170, 335 182" fill="none" stroke="#C89B3C" stroke-width="3" stroke-dasharray="5 4"/>

  <!-- hand, viewed end-on as a dial so the rotation reads clearly -->
  <g class="dial-wrap">
    <circle cx="248" cy="163" r="20" fill="#1B2A4E"/>
    <circle cx="248" cy="145" r="6" fill="#5B6B8F"/>
    <circle cx="265" cy="163" r="7" fill="#C89B3C"/>
  </g>

  <path d="M248 128 A 36 36 0 0 0 212 150" fill="none" stroke="#C89B3C" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowP)"/>
  <defs>
    <marker id="arrowP" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#C89B3C"/>
    </marker>
  </defs>

  <text x="150" y="220" text-anchor="middle" font-size="15" font-weight="700" fill="#1B2A4E" font-family="system-ui,sans-serif">Forearm flat, elbow still</text>
  <text x="248" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#1B2A4E" font-family="system-ui,sans-serif">Pinky rotates up &amp; left</text>
  <text x="335" y="205" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5B6B8F" font-family="system-ui,sans-serif">Band anchored</text>
</svg>
